const STATE_CYCLE = ["unknown", "unknown", "locked", "unknown", "unknown", "locked", "locked", "unknown", "unknown", "locked"];

// только для активных кластеров, поэтому "Активные" всегда ⩾ суммы держат/не держат/ошибка.
// Неактивные — вообще без статуса проверки (см. PositionCell).
// forcedType — для наглядности демо часть активных кластеров гарантированно резолвится в конкретный
// результат при проверке, а не выбирается случайно из RESOLVE_TYPES.
const GROUPS = [

  { count: 10, filterStatus: "active", kind: () => "forced_holding" },       // гарантированно попадают в диапазон при проверке
  { count: 2, filterStatus: "active", kind: () => "forced_out_of_range" },   // гарантированно НЕ попадают в диапазон при проверке
  { count: 10, filterStatus: "active", kind: () => "locked" },               // гарантированно ошибка/лимит — не держат позицию
  { count: 10, filterStatus: "inactive", kind: () => "inactive" },           // неактивные — карточка не показывается, статуса нет
];

const initialClusters = [];
{
  let id = 1;
  let nameIdx = 0;

    for (let i = 0; i < count; i++) {
      const k = kind(i);
      const positionLocked = k === "locked";
      const forcedType = k === "forced_holding" ? "holding" : k === "forced_out_of_range" ? "out_of_range" : null;
      initialClusters.push({
        id: id++,
        name: NAME_POOL[nameIdx++ % NAME_POOL.length],
        filterStatus,
        positionLocked,
        forcedType,
        notHoldingReason: positionLocked ? NOT_HOLDING_REASON : null,

  if (cluster.positionLocked) return CANT_HOLD_HISTORY;
  if (cluster.bidder && cluster.bidder.state === "resolved" && cluster.bidder.type === "returning") return RETURNING_HISTORY;

}

    { day: 6, time: "09:40", bid: 240, position: 9 },
    { day: 6, time: "16:00", bid: 220, position: 7 },
    { day: 7, time: "09:10", bid: 220, position: 9 },
  ],
};

// у этой истории система тоже пытается компенсировать рост ставки, но конкуренция обгоняет —
// один временный успех есть, дальше рост продолжается вплоть до упора в лимит
const CANT_HOLD_CHART = {
  ranges: [{ fromDay: 1, rangeMin: 1, rangeMax: 3 }],
  points: [
    { day: 1, time: "09:30", bid: 190, position: 7 },
    { day: 1, time: "14:20", bid: 200, position: 9 },
    { day: 2, time: "10:00", bid: 210, position: 11 },
    { day: 2, time: "20:15", bid: 205, position: 7 },
    { day: 3, time: "11:30", bid: 215, position: 11 },
    { day: 3, time: "18:45", bid: 220, position: 13 },
    { day: 4, time: "09:00", bid: 225, position: 14 },
    { day: 5, time: "09:30", bid: 220, position: 9, gapBefore: true },
    { day: 5, time: "11:50", bid: 230, position: 11 },
    { day: 5, time: "18:00", bid: 240, position: 13 },
    { day: 6, time: "08:40", bid: 255, position: 14 },
    { day: 7, time: "06:55", bid: 260, position: 8, gapBefore: true },
    { day: 7, time: "10:15", bid: 270, position: 12 },
    { day: 7, time: "14:20", bid: 300, position: 15 },
  ],
};

// День 7 = сегодня (актуально для CANT_HOLD, где пауза длится по настоящий момент), остальные — по порядку назад
const DAY_DATES = { 1: "18 июля", 2: "19 июля", 3: "20 июля", 4: "21 июля", 5: "22 июля", 6: "23 июля", 7: "24 июля" };
const DAY_DATES_SHORT = { 1: "18.07.26", 2: "19.07.26", 3: "20.07.26", 4: "21.07.26", 5: "22.07.26", 6: "23.07.26", 7: "24.07.26" };
// пресеты периода в шапке сайдбара — фильтруют и историю, и график по количеству последних дней
const RANGE_PRESETS = [
  { days: 7, label: "7 дней" },
  { days: 3, label: "3 дня" },
  { days: 1, label: "1 день" },
];

function getChartForCluster(cluster) {
  if (cluster.positionLocked) return CANT_HOLD_CHART;
  if (cluster.bidder && cluster.bidder.state === "resolved" && cluster.bidder.type === "returning") return RETURNING_CHART;
  return HOLDING_CHART;
}

// "красивые" равномерные деления оси (аналог d3.ticks) — шаг 1/2/5×10^n, автоматически под диапазон данных
function niceTicks(min, max, count) {
  const range = max - min || 1;
  const rawStep = range / Math.max(count - 1, 1);
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const niceMin = Math.floor(min / step) * step;
  const niceMax = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = niceMin; v <= niceMax + step / 2; v += step) ticks.push(Math.round(v));
  return ticks;
}

// сглаженная кривая через точки (catmull-rom → bezier) — визуально спокойнее ломаной линии
function smoothPath(pts) {
  if (pts.length < 2) return "";
  if (pts.length === 2) return `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} L${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

// лёгкий самодостаточный SVG-график вместо внешней библиотеки — та же визуальная задача
// (двойная ось Y, инвертированная позиция, диапазон-полоса, разрывы на паузах, сетка, сглаживание),
// без риска тянуть recharts+react-is через CDN в сборке на устаревшем babel-standalone
function HistoryChart({ chart }) {
  const [posView, setPosView] = useState("line");
  const { points, ranges } = chart;
  const W = 560, H = 300;
  const padL = 46, padR = 46, padT = 20, padB = 34;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = points.length;
  const BID_COLOR = "#16a34a";
  const POS_COLOR = "#7c3aed";

  const bids = points.map((p) => p.bid);
  const bidTicks = niceTicks(Math.min(...bids), Math.max(...bids), 5);
  const bidMin = bidTicks[0], bidMax = bidTicks[bidTicks.length - 1];

  // шкала позиции всегда от 1 (лучшая) до 16 (худшая) — по границам трёх стратегий автобиддера
  // (1–3 / 3–10 / 10–16), а не по фактическому диапазону данных, чтобы шкала была сравнимой и предсказуемой;
  // деления — с ровным шагом, а не только по границам стратегий, чтобы шкала читалась как обычная сетка
  const posTicks = [1, 4, 7, 10, 13, 16];
  const posMin = 1, posMax = 16;

  const xAt = (i) => padL + (n === 1 ? chartW / 2 : (i / (n - 1)) * chartW);
  const yBid = (v) => padT + chartH - ((v - bidMin) / (bidMax - bidMin)) * chartH;
  // обе оси читаются одинаково — снизу вверх от меньшего к большему, как и денежная шкала,
  // чтобы не путать пользователя разнонаправленными осями на одном графике
  const yPos = (v) => padT + chartH - ((v - posMin) / (posMax - posMin)) * chartH;

  // разбиваем точки на непрерывные сегменты — разрыв на месте простоя (gapBefore)
  const segments = [];
  let cur = [0];
  for (let i = 1; i < n; i++) {
    if (points[i].gapBefore) { segments.push(cur); cur = [i]; }
    else cur.push(i);
  }
  segments.push(cur);
  const gaps = segments.slice(0, -1).map((seg, si) => ({
    x1: xAt(seg[seg.length - 1]),
    x2: xAt(segments[si + 1][0]),
  }));

  // одна подпись даты на день, по центру точек этого дня (а не на каждую точку)
  const dayGroups = [];
  points.forEach((p, i) => {
    const grp = dayGroups[dayGroups.length - 1];
    if (grp && grp.day === p.day) grp.idxs.push(i);
    else dayGroups.push({ day: p.day, idxs: [i] });
  });

  const bidPts = (idxs) => idxs.map((i) => [xAt(i), yBid(points[i].bid)]);
  const posPts = (idxs) => idxs.map((i) => [xAt(i), yPos(points[i].position)]);

  // столбики — по одному тонкому бару на каждую точку (событие), а не один на день,
  // чтобы было видно все внутридневные изменения позиции подряд
  const barW = Math.min(14, (chartW / Math.max(n, 1)) * 0.45);

  // желаемый диапазон может меняться пользователем в течение недели (см. ranges) — полоса пересчитывается
  // на каждой точке и рвётся заново там, где меняется диапазон, а не только на паузах
  const rangeForDay = (day) => {
    let best = ranges[0];
    for (const r of ranges) { if (r.fromDay <= day) best = r; }
    return best;
  };
  // диапазон не исчезает во время паузы (он остаётся настроен, просто не проверяется) — полоса рвётся
  // только там, где диапазон реально меняется, а не на каждой паузе
  const bandSegments = [];
  {
    let cur = { startIdx: 0, range: rangeForDay(points[0].day) };
    for (let i = 1; i < n; i++) {
      const r = rangeForDay(points[i].day);
      if (r !== cur.range) {
        bandSegments.push({ ...cur, endIdx: i - 1 });
        cur = { startIdx: i, range: r };
      }
    }
    bandSegments.push({ ...cur, endIdx: n - 1 });
  }

  return (
    <div>
      <div className="flex justify-end mb-2">
        <div className="inline-flex bg-gray-100 rounded-lg p-1">
          <button onClick={() => setPosView("line")}
                  className={`px-2.5 py-1 rounded-md text-xs font-medium transition-colors ${posView === "line" ? "bg-white text-gray-900 shadow-sm" : "text-gray-500 hover:text-gray-700"}`}>
            Линия
          </button>
          <button onClick={() => setPosView("bars")}
                  className={`px-2.5 py-1 rounded-md text-xs font-medium transition-colors ${posView === "bars" ? "bg-white text-gray-900 shadow-sm" : "text-gray-500 hover:text-gray-700"}`}>
            Столбики
          </button>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" style={{ overflow: "visible" }}>
        <defs>
          <pattern id="gapHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="6" height="6" fill="#f4f5f6" />
            <line x1="0" y1="0" x2="0" y2="6" stroke="#d7dade" strokeWidth="1.5" />
          </pattern>
        </defs>

        {gaps.map((g, i) => (
          <rect key={`gap${i}`} x={g.x1} y={padT} width={Math.max(g.x2 - g.x1, 1)} height={chartH} fill="url(#gapHatch)" />
        ))}

        {/* горизонтальная сетка — по делениям обеих осей (ставка и позиция), нижняя линия одновременно служит осью X */}
        {bidTicks.map((t, i) => (
          <line key={`gh${i}`} x1={padL} y1={yBid(t)} x2={padL + chartW} y2={yBid(t)} stroke="#eef1f3" strokeWidth="1" />
        ))}
        {posTicks.map((t, i) => (
          <line key={`gp${i}`} x1={padL} y1={yPos(t)} x2={padL + chartW} y2={yPos(t)} stroke="#eef1f3" strokeWidth="1" />
        ))}
        {/* вертикальная сетка — по дням */}
        {dayGroups.map((g, i) => {
          const cx = g.idxs.reduce((s, i2) => s + xAt(i2), 0) / g.idxs.length;
          return <line key={`gv${i}`} x1={cx} y1={padT} x2={cx} y2={padT + chartH} stroke="#eef1f3" strokeWidth="1" />;
        })}

        {/* полоса желаемого диапазона: рвётся на паузах (простой) и меняет высоту там, где пользователь поменял диапазон.
            Правая граница сегмента тянется до начала следующего (или до края графика для последнего) — иначе, если
            смена диапазона происходит на последней точке, у нового диапазона не будет своей видимой ширины */}
        {bandSegments.map((seg, si) => {
          const x1 = xAt(seg.startIdx);
          const next = bandSegments[si + 1];
          // если сегмент последний и совпадает с правым краем графика (смена диапазона случилась на последней точке),
          // ширина по формуле выйдет нулевой — даём минимальную видимую ширину, чуть выходя за край графика
          const x2 = next ? xAt(next.startIdx) : Math.max(padL + chartW, x1 + 26);
          const bandTop = Math.max(padT, Math.min(yPos(seg.range.rangeMin), yPos(seg.range.rangeMax)));
          const bandBottom = Math.min(padT + chartH, Math.max(yPos(seg.range.rangeMin), yPos(seg.range.rangeMax)));
          return <rect key={`band${si}`} x={x1} y={bandTop} width={Math.max(x2 - x1, 0)} height={Math.max(0, bandBottom - bandTop)} fill={POS_COLOR} fillOpacity="0.035" />;
        })}

        {posView === "bars" && points.map((p, i) => {
          const yTop = yPos(p.position);
          const height = Math.max(0, (padT + chartH) - yTop);
          // не даём столбику вылезти за пределы графика по X (крайние точки иначе перекрывают подписи оси)
          const x = Math.max(padL, Math.min(padL + chartW - barW, xAt(i) - barW / 2));
          return <rect key={`bar${i}`} x={x} y={yTop} width={barW} height={height} rx="2" fill={POS_COLOR} fillOpacity="0.85" />;
        })}

        {segments.map((seg, si) => <path key={`b${si}`} d={smoothPath(bidPts(seg))} fill="none" stroke={BID_COLOR} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />)}
        {posView === "line" && segments.map((seg, si) => <path key={`p${si}`} d={smoothPath(posPts(seg))} fill="none" stroke={POS_COLOR} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />)}

        {/* подпись даты — раз на день, по центру точек этого дня */}
        {dayGroups.map((g, i) => {
          const cx = g.idxs.reduce((s, i2) => s + xAt(i2), 0) / g.idxs.length;
          return (
            <text key={`d${i}`} x={cx} y={padT + chartH + 20} fontSize="10.5" fill="#9aa1ac" textAnchor="middle">
              {DAY_DATES[g.day]}
            </text>
          );
        })}

        {/* названия шкал */}
        <text x={padL - 10} y={padT - 8} fontSize="10" fill="#9aa1ac" textAnchor="end">Ставка</text>
        <text x={padL + chartW + 10} y={padT - 8} fontSize="10" fill="#9aa1ac">Позиция</text>

        {/* подписи левой оси (ставка) */}
        {bidTicks.map((t, i) => (
          <text key={`bl${i}`} x={padL - 10} y={yBid(t) + 3.5} fontSize="10.5" fill="#9aa1ac" textAnchor="end">{t} ₽</text>
        ))}
        {/* подписи правой оси (позиция) */}
        {posTicks.map((t, i) => (
          <text key={`pl${i}`} x={padL + chartW + 10} y={yPos(t) + 3.5} fontSize="10.5" fill="#9aa1ac">{t}</text>
        ))}
      </svg>
      <div className="flex items-center justify-center flex-wrap gap-x-5 gap-y-1.5 mt-3 text-xs text-gray-500">
        <span className="inline-flex items-center gap-2"><span className="w-3.5 h-[2.5px] rounded-full inline-block" style={{ background: BID_COLOR }} />Ставка, ₽</span>
        <span className="inline-flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ background: POS_COLOR, opacity: 0.85 }} />Позиция</span>
        <span className="inline-flex items-center gap-2">
          <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ background: POS_COLOR, opacity: 0.12 }} />
          Желаемый диапазон позиции
        </span>
        <span className="inline-flex items-center gap-2">
          <span className="w-3 h-3 rounded-sm inline-block border border-gray-300"
                style={{ backgroundImage: "repeating-linear-gradient(45deg, #d7dade 0 1.5px, transparent 1.5px 5px)", backgroundColor: "#f4f5f6" }} />
          Автобиддер на паузе
        </span>
      </div>
    </div>
  );
}

                  <ICalendar className="w-4 h-4" /> {rangeLabel}

              {tab === "history" ? "Скачать историю" : "Скачать график"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );

// тултип на position:fixed с координатами из getBoundingClientRect — таблица кластеров скроллится
// (overflow-y-auto), а это в CSS неявно обрезает и overflow-x тоже, так что абсолютный тултип внутри
// такого контейнера обрезается краем строки; fixed игнорирует overflow предков и не обрезается
function FixedTooltip({ anchorRef, show, children, width = 288 }) {
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (show && anchorRef.current) {
      const r = anchorRef.current.getBoundingClientRect();
      setPos({ top: r.top - 8, left: r.right - width });
    }
  }, [show]);
  if (!show || !pos) return null;
  return (
    <div style={{ position: "fixed", top: pos.top, left: pos.left, width, transform: "translateY(-100%)" }}
         className="z-50 pointer-events-none">
      {children}
    </div>
  );
}

/* ───────────────────────── Кнопка "история" со всплывающей подсказкой ───────────────────────── */
function HistoryTrigger({ onClick }) {
  const [show, setShow] = useState(false);
  const ref = useRef(null);
  return (
    <span className="relative inline-flex shrink-0">
      <button ref={ref} onClick={onClick} onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}
              className="text-gray-400 hover:text-gray-600">
        <IHistory className="w-3.5 h-3.5" />
      </button>
      <FixedTooltip anchorRef={ref} show={show} width={168}>
        <div className="rounded-2xl bg-gray-700 text-white text-sm font-semibold px-4 py-2.5 shadow-xl whitespace-nowrap text-center">
          Посмотреть историю
        </div>
      </FixedTooltip>
    </span>
  );
}

/* ───────────────────────── Position cell ───────────────────────── */
function PositionCell({ cluster, onRequest, onShowHistory }) {
  const { bidder, avgPosition, positionLocked, notHoldingReason, filterStatus } = cluster;
  const [showReturningTip, setShowReturningTip] = useState(false);
  const returningRef = useRef(null);

  // неактивный кластер — автобиддер по нему не работает, поэтому у него нет вообще никакого статуса позиции
  if (filterStatus === "inactive") {
    return (
      <div className="flex flex-col items-end gap-1 min-h-[38px] justify-center">
        <span className="text-[15px] text-gray-400">—</span>
      </div>
    );
  }

  return (
    <div className="flex flex-col items-end gap-1 min-h-[38px] justify-center">
      <span className="text-[15px] text-gray-900">{avgPosition}</span>

      {positionLocked && (
        <span className="inline-flex items-center justify-end gap-1 whitespace-nowrap text-sm text-amber-600 text-right">
          <IAlertTriangle className="w-3.5 h-3.5 shrink-0" />
          <span>{notHoldingReason}</span>
          <HistoryTrigger onClick={() => onShowHistory(cluster)} />
        </span>
      )}

      {!positionLocked && bidder.state === "unknown" && (
        <button onClick={() => onRequest(cluster.id)}
                className="text-sm text-blue-600 hover:text-blue-700 hover:underline text-right leading-tight">
          узнать текущую
        </button>
      )}

      {bidder.state === "loading" && (
        <span className="inline-flex items-center gap-1.5 text-sm text-gray-400">
          <ISpinner /> проверяем...
        </span>
      )}

      {bidder.state === "resolved" && bidder.type === "holding" && (
        <span className="inline-flex items-center justify-end gap-1 whitespace-nowrap text-sm text-gray-700 text-right">
          <ICheckCircle className="w-3.5 h-3.5 shrink-0 text-emerald-600" />
          <span>текущая: {bidder.currentPosition}</span>
          <button onClick={() => onRequest(cluster.id)} className="text-blue-600 hover:text-blue-700">
            <IRefresh className="w-3.5 h-3.5" />
          </button>
          <HistoryTrigger onClick={() => onShowHistory(cluster)} />
        </span>
      )}

      {bidder.state === "resolved" && bidder.type === "out_of_range" && (
        <span className="inline-flex items-center justify-end gap-1 whitespace-nowrap text-sm text-gray-700 text-right">
          <span>текущая: {bidder.currentPosition}</span>
          <button onClick={() => onRequest(cluster.id)} className="text-blue-600 hover:text-blue-700">
            <IRefresh className="w-3.5 h-3.5" />
          </button>
          <HistoryTrigger onClick={() => onShowHistory(cluster)} />
        </span>
      )}

      {bidder.state === "resolved" && bidder.type === "returning" && (
        <span className="inline-flex items-center justify-end gap-1 whitespace-nowrap text-sm text-gray-700 text-right">
          <span ref={returningRef} className="relative cursor-default"
                onMouseEnter={() => setShowReturningTip(true)} onMouseLeave={() => setShowReturningTip(false)}>
            возвращаем в диапазон
          </span>
          <FixedTooltip anchorRef={returningRef} show={showReturningTip} width={288}>
            <div className="rounded-xl bg-gray-800 text-white text-sm p-3 shadow-xl text-left">
              <p className="leading-snug">Позиция вышла за пределы диапазона, корректирует ставку для возврата</p>
            </div>
          </FixedTooltip>
          <button onClick={() => onRequest(cluster.id)} className="text-blue-600 hover:text-blue-700">
            <IRefresh className="w-3.5 h-3.5" />
          </button>
          <HistoryTrigger onClick={() => onShowHistory(cluster)} />
        </span>
      )}

    </div>
  );
}

/* ───────────────────────── Cluster row ───────────────────────── */
function ClusterRow({ cluster, onRequest, onShowHistory }) {
  return (
    <div className="grid items-center gap-4 px-6 py-4 border-t border-gray-100 hover:bg-gray-50/60"
         style={{ gridTemplateColumns: "1fr 220px 100px 100px 140px 110px 90px" }}>

}

/* ───────────────────────── Filter pill ───────────────────────── */
function Pill({ label, count, active, onClick, icon }) {
  return (
    <button onClick={onClick}
            className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-sm font-medium transition-colors ${
              active ? "bg-violet-600 text-white" : "bg-gray-100 text-gray-700 hover:bg-gray-200"
            }`}>

}

/* ───────────────────────── Column header ───────────────────────── */
function ColHead({ label, tip, className = "" }) {
  return (
    <div className={`flex items-center gap-1 text-sm text-gray-500 ${className}`}>
      <span>{label}</span>
      <Tip text={tip} />
      <IArrowUp className="w-3 h-3 text-gray-400" />

  );
}

/* ───────────────────────── Main component ───────────────────────── */
function ProductClustersCard() {
  const [expanded, setExpanded] = useState(true);
  const [clusters, setClusters] = useState(initialClusters);
  const [activeFilter, setActiveFilter] = useState("active");
  const [query, setQuery] = useState("");
  const [pageSize, setPageSize] = useState(10);
  const [page, setPage] = useState(1);
  const [recommendation, setRecommendation] = useState("12");
  const [holdingLoading, setHoldingLoading] = useState(false);
  const [outOfRangeLoading, setOutOfRangeLoading] = useState(false);
  const [historyCluster, setHistoryCluster] = useState(null);

  const requestPosition = (id) => {
    // повторное обновление уже проверенного кластера не должно менять его категорию (держит/не держит) —
    // случайно скакать между статусами при простом рефреше нелогично, обновляется только цифра позиции
    const prevCluster = clusters.find((c) => c.id === id);
    const previousType = prevCluster && prevCluster.bidder.state === "resolved" ? prevCluster.bidder.type : null;
    setClusters((prev) => prev.map((c) => (c.id === id ? { ...c, bidder: { state: "loading" } } : c)));
    const delay = 800 + Math.random() * 700;
    setTimeout(() => {
      setClusters((prev) =>
        prev.map((c) => {
          if (c.id !== id) return c;
          // forcedType — кластер гарантированно резолвится в конкретный результат, проверка не может выявить другое
          const type = c.forcedType || previousType || RESOLVE_TYPES[Math.floor(Math.random() * RESOLVE_TYPES.length)];
          // держим позицию — попадает в целевой диапазон 3–10 (см. "Автобиддер" в шапке товара);
          // вне диапазона — заведомо хуже (11–16), а не любое случайное число
          if (type === "holding") {
            return { ...c, lastType: type, bidder: { state: "resolved", type, currentPosition: Math.floor(Math.random() * (10 - 3 + 1)) + 3 } };
          }
          if (type === "out_of_range") {
            return { ...c, lastType: type, bidder: { state: "resolved", type, currentPosition: Math.floor(Math.random() * (16 - 11 + 1)) + 11 } };
          }
          return { ...c, lastType: type, bidder: { state: "resolved", type } };
        })
      );
    }, delay);
  };

  // три независимых статуса — не статичные теги, а живое вычисление по факту проверки:
  // попали в диапазон = проверка подтвердила "holding"; не попали = проверка подтвердила "вне диапазона";
  // не держат позиции = ошибка/лимит автобиддера (статический тег, известен без проверки)
  // сверяемся с lastType (а не с текущим bidder.state) — иначе строка на время рефреша ("loading")
  // выпадала бы из своей же вкладки фильтра, и соседние строки "прыгали" бы, заполняя пустое место
  const isHolding = (c) => c.lastType === "holding";
  const isOutOfRange = (c) => c.lastType === "out_of_range";
  const isError = (c) => c.positionLocked;

  const counts = useMemo(
    () => ({
      active: clusters.filter((c) => c.filterStatus === "active").length,
      inactive: clusters.filter((c) => c.filterStatus === "inactive").length,
      // счётчик есть только у "Не держат позиции" — это статический тег (ошибка/лимит), известен заранее.
      // "Попали"/"Не попали в диапазон" подтверждаются только проверкой, поэтому у них счётчика нет
      not_holding: clusters.filter(isError).length,
    }),
    [clusters]
  );

  const filtered = useMemo(() => {
    const matchesTab = (c) => {
      if (activeFilter === "holding") return isHolding(c);
      if (activeFilter === "out_of_range") return isOutOfRange(c);
      if (activeFilter === "not_holding") return isError(c);
      return c.filterStatus === activeFilter;
    };
    return clusters.filter((c) => matchesTab(c) && c.name.toLowerCase().includes(query.trim().toLowerCase()));
  }, [clusters, activeFilter, query]);

  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const pageItems = filtered.slice((page - 1) * pageSize, page * pageSize);

  const selectFilter = (f) => {
    setActiveFilter(f);
    setPage(1);
    // переход на "Держат позицию" — как будто нажали "узнать текущую" сразу у всех кластеров вкладки;
    // сколько из них реально держат, неизвестно заранее — пока не проверили, счётчик не показываем
    if (f === "holding") {
      setHoldingLoading(true);
      setClusters((prev) => prev.map((c) => (c.forcedType === "holding" ? { ...c, bidder: { state: "loading" } } : c)));
      setTimeout(() => {
        setClusters((prev) =>
          prev.map((c) =>
            c.forcedType === "holding"
              ? { ...c, lastType: "holding", bidder: { state: "resolved", type: "holding", currentPosition: Math.floor(Math.random() * (10 - 3 + 1)) + 3 } }
              : c
          )
        );
        setHoldingLoading(false);
      }, 1200);
    }
    // переход на "Не попали в диапазон" — та же логика: сразу показываем гарантированные примеры,
    // не заставляя вручную нажимать "узнать текущую" у каждого
    if (f === "out_of_range") {
      setOutOfRangeLoading(true);
      setClusters((prev) => prev.map((c) => (c.forcedType === "out_of_range" ? { ...c, bidder: { state: "loading" } } : c)));
      setTimeout(() => {
        setClusters((prev) =>
          prev.map((c) =>
            c.forcedType === "out_of_range"
              ? { ...c, lastType: "out_of_range", bidder: { state: "resolved", type: "out_of_range", currentPosition: Math.floor(Math.random() * (16 - 11 + 1)) + 11 } }
              : c
          )
        );
        setOutOfRangeLoading(false);
      }, 1200);
    }
  };

  return (
    <React.Fragment>
    <div className="w-full max-w-[1400px] mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
      {/* ── Header ── */}
      <div className="flex items-center justify-between px-6 pt-6 pb-5">
        <div className="flex items-baseline gap-2">
          <h1 className="text-2xl font-bold text-gray-900">Товары</h1>
          <span className="text-lg text-gray-400">1 шт.</span>
        </div>
        <div className="flex items-center gap-3">
          <button className="flex items-center gap-1.5 bg-gray-900 text-white text-sm font-medium px-4 py-2.5 rounded-lg hover:bg-gray-800">
            <IPlus className="w-4 h-4" /> Добавить товары
          </button>
          <button className="flex items-center gap-1.5 bg-white text-gray-900 text-sm font-medium px-4 py-2.5 rounded-lg border border-gray-300 hover:bg-gray-50">
            Загрузить <IChevronDown className="w-4 h-4" />
          </button>
        </div>
      </div>

      {/* ── Table header (product row) ── */}
      <div className="flex items-center px-6 pb-3 text-sm text-gray-500 border-b border-gray-100">
        <div style={{ width: 320 }}>Фото · Бренд · Артикул · Название</div>
        <div className="flex items-center gap-1" style={{ width: 220 }}>Рекомендации <Tip text="Рекомендованная цена показа" /></div>
        <div className="flex items-center gap-1" style={{ width: 180 }}>Поиск <Tip text="Диапазон цены в поиске" /></div>
        <div className="flex items-center gap-1 flex-1">Автобиддер <Tip text="Настройки автоматического управления ставками" /></div>
      </div>

      {/* ── Product row ── */}
      <div className="flex items-center px-6 py-5 border-b border-gray-100">
        <div className="flex items-center gap-3" style={{ width: 320 }}>
          <div className="w-16 h-16 rounded-lg bg-gray-200 flex items-center justify-center overflow-hidden shrink-0">
            <svg viewBox="0 0 24 24" className="w-9 h-9 text-gray-400" fill="currentColor">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7v1H4v-1Z"/>
            </svg>
          </div>
          <div className="min-w-0">
            <div className="text-[15px] font-semibold text-gray-900 truncate">Штаны лосины для спорта</div>
            <div className="flex items-center gap-1.5 text-sm text-gray-500 mt-1 flex-wrap">
              <span>Бренд</span>
              <span className="text-gray-300">·</span>
              <span>wb5wp9v6kg</span>
              <ICopy className="w-3.5 h-3.5 text-gray-400" />
              <span className="text-gray-300">·</span>
              <span className="inline-flex items-center gap-1 text-amber-600">
                <IAlertTriangle className="w-3.5 h-3.5" /> Конфликт показов
              </span>
            </div>
          </div>
        </div>

        <div style={{ width: 220 }}>
          <input
            value={recommendation}
            onChange={(e) => setRecommendation(e.target.value.replace(/[^0-9]/g, ""))}
            className="w-[140px] text-right border border-gray-200 rounded-lg px-3 py-2 text-[15px] text-gray-900 focus:outline-none focus:ring-2 focus:ring-violet-200 focus:border-violet-400"
          />
          <span className="ml-1 text-[15px] text-gray-900">₽</span>
        </div>

        <div style={{ width: 180 }} className="text-[15px] text-gray-900">16–23 ₽</div>

        <div className="flex items-center justify-between flex-1">
          <span className="text-[15px] text-blue-600 cursor-default">3–10 позиции в поиске</span>
          <div className="flex items-center gap-3">
            <button className="text-gray-400 hover:text-gray-600">
              <IMoreHorizontal className="w-5 h-5" />

            <button onClick={() => setExpanded((v) => !v)} className="text-gray-500 hover:text-gray-700">
              {expanded ? <IChevronUp className="w-5 h-5" /> : <IChevronDown className="w-5 h-5" />}
            </button>
          </div>
        </div>
      </div>

      {/* ── Expanded cluster panel ── */}

            <Pill label="Попали в диапазон" active={activeFilter === "holding"} onClick={() => selectFilter("holding")} />

            </div>
          </div>

          {/* pagination */}
          <div className="flex items-center justify-between mt-5">

              ))}
              <button
                onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                disabled={page >= totalPages}
                className="text-gray-400 hover:text-gray-600 disabled:opacity-30 disabled:hover:text-gray-400 ml-1"
              >
                <IChevronRight className="w-5 h-5" />
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
    {historyCluster && (
      <HistorySidebar cluster={historyCluster} onClose={() => setHistoryCluster(null)} />
    )}
    </React.Fragment>
  );
}

function App() {
  return (
    <div className="min-h-screen flex items-start justify-center py-6">
      <ProductClustersCard />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
